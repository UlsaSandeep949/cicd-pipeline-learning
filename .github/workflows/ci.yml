name: Pipeline Dashboard CI

# Run CI for pushes to main and pull requests targeting main
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  # --------------------------------------------------
  # Backend CI
  # --------------------------------------------------
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall backend


  # --------------------------------------------------
  # Frontend CI
  # --------------------------------------------------
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build React application
        working-directory: frontend
        run: |
          npm run build


  # --------------------------------------------------
  # Deploy to Mac using self-hosted runner
  # --------------------------------------------------
  deploy-to-mac:
    name: Deploy to Mac
    runs-on: self-hosted

    needs:
      - backend-check
      - frontend-check

    # Deploy only after a successful push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify Docker installation
        run: |
          docker --version
          docker compose version

      - name: Rebuild and restart Docker services
        run: |
          docker compose up --build -d

      - name: Check running containers
        run: |
          docker compose ps

      # --------------------------------------------------
      # Backend health check with retry logic
      # --------------------------------------------------
      - name: Check backend health
        run: |
          echo "Waiting for backend to become ready..."

          for i in {1..12}; do
            echo "Health-check attempt $i/12"

            if curl --fail --silent --show-error \
              http://127.0.0.1:8000/health; then

              echo ""
              echo "Backend is healthy!"
              exit 0
            fi

            echo "Backend is not ready yet."
            sleep 5
          done

          echo "Backend health check failed."
          echo "Displaying backend logs..."

          docker compose logs backend

          exit 1

      # --------------------------------------------------
      # Frontend availability check
      # --------------------------------------------------
      - name: Check frontend availability
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:3001

          echo ""
          echo "Frontend is available!"

      - name: Display final service status
        run: |
          docker compose ps
